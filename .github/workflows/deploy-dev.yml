name: Dev

on:
  pull_request:
    branches: [ Dev ]
  push:
    branches: [ Dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore 10_Garage.slnx

      - name: Build
        run: dotnet build 10_Garage.slnx -c Release --no-restore

      - name: Test
        run: dotnet test 10_Garage.slnx -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish Garage.Web/Garage.Web.csproj -c Release -o ${{ github.workspace }}/publish --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ github.workspace }}/publish

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish